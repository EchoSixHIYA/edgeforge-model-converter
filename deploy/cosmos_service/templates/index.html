<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmos · 板端推理</title>
<style>
:root{color-scheme:light;--ink:#173331;--muted:#667b77;--line:#dce6e1;--green:#006e5c;--bg:#f3f6f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:32px max(24px,calc((100vw - 1140px)/2));background:#133d36;color:#fff}header small{color:#afd3c4;letter-spacing:2px}h1{font-size:30px;line-height:1.25;margin:10px 0}header p{margin:0;color:#c4dbd1}.wrap{max-width:1188px;margin:28px auto;padding:0 24px}.status{display:flex;gap:14px;align-items:center;margin-bottom:20px}.pill{border-radius:20px;padding:5px 14px;font-size:13px;background:#e1ebe5;color:#365e50}.pill.ready{background:#d8efdf;color:#166033}.pill.error{background:#f9dfda;color:#a4382b}.grid{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:24px}.card{padding:26px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 6px 24px #16382b05}h2{font-size:19px;margin:0 0 20px}.field{display:block;margin:0 0 18px}label span,.label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}textarea,input[type=number],select{width:100%;font:inherit;color:var(--ink);background:#fafcf9;border:1px solid #cbd9d1;border-radius:9px;padding:10px 12px}textarea{resize:vertical;min-height:148px}textarea:focus,input:focus,select:focus{outline:2px solid #68ab8e;outline-offset:1px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hint{font-size:12px;color:var(--muted);margin:5px 0 0}.upload{border:1px dashed #9fbbb0;border-radius:10px;padding:16px;background:#f8fbf6}input[type=file]{max-width:100%;font-size:13px}.check{display:flex;gap:8px;align-items:center;margin:0 0 20px;font-size:13px}button{border:0;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer;background:var(--green);color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%}.small{padding:6px 12px;background:#e7efe9;color:var(--ink);font-size:12px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.result-head h2{margin-bottom:0}.result{white-space:pre-wrap;overflow-wrap:anywhere;min-height:245px;margin:24px 0;color:#26423b;line-height:1.9}.placeholder{color:#8b9b93}.meta{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}pre{max-height:360px;overflow:auto;font-size:12px;background:#f3f6f3;border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;font-size:13px;color:var(--muted)}.notice{color:#92621b;background:#fff7e6;padding:10px 14px;border-radius:8px;font-size:13px;margin:16px 0}.footer{font-size:12px;color:var(--muted);margin:18px 0}a{color:var(--green)}#preview{display:none;max-width:100%;max-height:140px;margin-top:12px;border-radius:6px}@media(max-width:780px){.grid{grid-template-columns:1fr}header{padding:26px 24px}.wrap{padding:0 16px;margin-top:20px}.card{padding:20px}.status{align-items:flex-start;flex-wrap:wrap}h1{font-size:25px}}[hidden]{display:none!important}
</style>
</head>
<body>
<header><small>EDGEFORGE / ON-DEVICE INFERENCE</small><h1>Cosmos 场景理解</h1><p>文字提问、图片理解、短视频分析 · BM1684X 本地推理</p></header>
<main class="wrap">
<div class="status" aria-live="polite"><span class="pill" id="state">连接中</span><span class="hint" id="stateDetail">正在获取模型状态…</span></div>
<div class="grid">
<section class="card"><h2>发起推理</h2>
<form id="form">
<label class="field"><span>推理模型</span><select name="model"><option value="cosmos-reason2-2b">Cosmos Reason2 · 2B / W4BF16</option></select></label>
<label class="field"><span>你的问题</span><textarea name="prompt" required maxlength="8000" placeholder="例如：请描述图片中的场景，并解释正在发生什么。">请简要描述这张图片中的内容。</textarea></label>
<div class="field upload"><label for="media" class="label">图片或短视频（可选）</label><input id="media" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,.mp4,.mov,.mkv,.webm,.avi"><p class="hint">不上传即为纯文本。文件 ≤32 MiB，视频 ≤30 秒。</p><img id="preview" alt="已选择的图片预览"></div>
<div class="row"><label class="field"><span>最多生成 token</span><input name="max_new_tokens" type="number" min="1" max="256" value="64" required></label><label class="field" id="framesField" hidden><span>视频采样帧数</span><input name="num_frames" type="number" min="2" max="8" value="4"></label></div>
<label class="check"><input id="greedy" type="checkbox" checked>确定性生成（greedy）</label>
<button class="primary" id="submit" disabled>开始推理</button>
<p class="hint">上下文 2048 · 每图/视频时序组最多 144 视觉 token · 单任务运行</p>
</form></section>
<section class="card"><div class="result-head"><h2>推理结果</h2><button class="small" id="copy" disabled>复制 JSON</button></div><div id="notice" class="notice" hidden role="alert"></div><div id="result" class="result placeholder" aria-live="polite">模型就绪后，即可在左侧提交问题。<br>结果和完整 JSON 会显示在这里。</div><div class="meta" id="meta">输入媒体仅用于本次推理，完成后自动清理。</div><details style="margin-top:18px"><summary>查看完整接口返回</summary><pre id="json">尚无结果</pre></details></section>
</div>
<div class="footer"><a href="/health" target="_blank" rel="noopener">服务状态 JSON ↗</a></div>
</main>
<script>
'use strict';
const el=id=>document.getElementById(id);let inFlight=false,ready=false,mediaKind=null,lastJSON='',previewURL=null;
function message(text){el('notice').textContent=text;el('notice').hidden=!text}
async function check(){try{const r=await fetch('/health');const s=await r.json();ready=s.status==='ready';el('state').textContent=ready?(s.busy?'正在推理':'模型就绪'):(s.status==='error'?'加载失败':'模型加载中');el('state').className='pill '+(ready?'ready':s.status==='error'?'error':'');el('stateDetail').textContent=s.error||'BM1684X · W4BF16 · 上下文 2048 · 最大视觉预算 147456';el('submit').disabled=!ready||inFlight||s.busy}catch(e){ready=false;el('state').textContent='连接断开';el('state').className='pill error';el('submit').disabled=true}}
el('media').addEventListener('change',()=>{const file=el('media').files[0];mediaKind=file?(/\.(mp4|mov|mkv|webm|avi)$/i.test(file.name)?'video':'image'):null;el('framesField').hidden=mediaKind!=='video';if(previewURL)URL.revokeObjectURL(previewURL);el('preview').style.display='none';if(file&&mediaKind==='image'){previewURL=URL.createObjectURL(file);el('preview').src=previewURL;el('preview').style.display='block'}});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
el('form').addEventListener('submit',async e=>{e.preventDefault();if(inFlight||!ready)return;const file=el('media').files[0];if(file&&file.size>32*1024*1024){message('文件不得超过 32 MiB');return}inFlight=true;el('submit').disabled=true;el('submit').textContent='正在推理…';message('');el('result').textContent='等待板端生成结果…';el('result').classList.add('placeholder');const started=Date.now();const timer=setInterval(()=>{el('meta').textContent='推理中 · 已等待 '+Math.floor((Date.now()-started)/1000)+' 秒（页面可保持打开）'},1000);
try{const body=new FormData();body.set('model',e.target.model.value);body.set('prompt',e.target.prompt.value);body.set('max_new_tokens',e.target.max_new_tokens.value);body.set('greedy',String(el('greedy').checked));if(file){body.set(mediaKind,file);if(mediaKind==='video')body.set('num_frames',e.target.num_frames.value)}let r=await fetch('/api/jobs',{method:'POST',body});let job=await r.json();if(!r.ok)throw new Error(job.error||'提交失败');while(job.status==='queued'||job.status==='running'){await sleep(1500);r=await fetch('/api/jobs/'+encodeURIComponent(job.id));job=await r.json();if(!r.ok)throw new Error(job.error||'任务查询失败')}lastJSON=JSON.stringify(job,null,2);el('json').textContent=lastJSON;el('copy').disabled=false;if(!job.ok)throw new Error(job.error||'推理失败');el('result').textContent=job.result.text||'（模型未返回正文；请查看完整 JSON）';el('result').classList.remove('placeholder');el('meta').textContent='耗时 '+(job.elapsed_ms/1000).toFixed(2)+' 秒 · 输入 '+job.result.prompt_tokens+' token · 输出 '+job.result.token_ids.length+' token · 停止原因 '+job.result.finish_reason}catch(err){message(err.message);el('result').textContent='本次推理未完成。'}finally{clearInterval(timer);inFlight=false;el('submit').textContent='开始推理';check()}});
el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(lastJSON);el('copy').textContent='已复制'}catch{const blob=new Blob([lastJSON],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cosmos-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}setTimeout(()=>el('copy').textContent='复制 JSON',1500)});
check();setInterval(check,4000);
</script>
</body></html>
