[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeforge-model-sdk"
version = "2.2.0"
description = "Task-aware runtime SDK for EdgeForge RKNN, BModel and Qwen3-VL bundles"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21", "opencv-python>=4.5", "pyclipper>=1.3", "tokenizers>=0.20,<0.23"]

[project.optional-dependencies]
vlm = ["transformers==4.57.1", "torch==2.9.0", "torchvision==0.24.0", "Pillow>=10,<12", "av==16.0.1", "pybind11==2.13.6"]

[tool.setuptools]
packages = ["edgeforge_sdk"]

[tool.setuptools.package-data]
edgeforge_sdk = ["config.json", "*.rknn", "*.bmodel", "*.npy", "tokenizer/*"]
